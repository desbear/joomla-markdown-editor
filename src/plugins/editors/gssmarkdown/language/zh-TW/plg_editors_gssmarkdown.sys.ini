PLG_EDITORS_GSSMARKDOWN_XML_DESCRIPTION="給工程師的 Markdown 編輯器：左側 Markdown 原始碼（CodeMirror 6，使用 Joomla 核心內建），右側即時預覽由伺服器以與存檔相同的方式渲染、並套用前台文章版型，所見即發布結果。圖片可直接貼上或拖放上傳。文章保存 Markdown 原稿。需搭配「系統 - GSS Markdown」外掛。"
