PLG_SYSTEM_GSSMARKDOWN="System - GSS Markdown"
PLG_SYSTEM_GSSMARKDOWN_XML_DESCRIPTION="Server side of the GSS Markdown editor: renders submitted Markdown to filtered HTML, moves images of new articles into their folder and highlights code on the site. Must stay enabled while the editor is in use."
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_LABEL="HTML inside Markdown"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_DESC="Escape: HTML typed in Markdown is shown as text (safest). Allow listed tags: only the tags below are kept; attributes are limited to a safe list and event handlers/styles are always removed."
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_ESCAPE="Escape (show as text)"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_WHITELIST="Allow listed tags only"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_TAGS_LABEL="Allowed HTML tags"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_TAGS_DESC="Comma separated. script, iframe, object, embed, style and form elements are never allowed."
PLG_SYSTEM_GSSMARKDOWN_FRONTEND_HIGHLIGHT_LABEL="Highlight code on the site"
PLG_SYSTEM_GSSMARKDOWN_FRONTEND_HIGHLIGHT_DESC="Loads the bundled Prism highlighter on pages that contain code blocks written with this editor. No external files are loaded."
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_IMAGES="Images"
PLG_SYSTEM_GSSMARKDOWN_MAX_SIZE_LABEL="Maximum image size (MB)"
PLG_SYSTEM_GSSMARKDOWN_MAX_DIR_LABEL="Maximum per article (MB)"
PLG_SYSTEM_GSSMARKDOWN_MAX_DIR_DESC="Total size of images one article (or one unsaved draft) may hold."
PLG_SYSTEM_GSSMARKDOWN_ALLOW_SVG_LABEL="Allow SVG"
PLG_SYSTEM_GSSMARKDOWN_ALLOW_SVG_DESC="SVG files can contain scripts. When allowed, every SVG is sanitised (scripts, event handlers and remote references removed) before it is stored."
PLG_SYSTEM_GSSMARKDOWN_EASYBLOG_DIR_LABEL="EasyBlog image folder"
PLG_SYSTEM_GSSMARKDOWN_TMP_DIR_LABEL="Temporary folder"
PLG_SYSTEM_GSSMARKDOWN_TMP_DIR_DESC="Images pasted before an article's first save wait here. Direct web access is denied (.htaccess / web.config); the editor shows them through an authenticated URL."
PLG_SYSTEM_GSSMARKDOWN_GENERIC_DIR_LABEL="Other components' image folder"
PLG_SYSTEM_GSSMARKDOWN_GENERIC_DIR_DESC="Used for Joomla articles ({folder}/com_content/{id}) and for components without a save event (modules, categories)."
PLG_SYSTEM_GSSMARKDOWN_TMP_DAYS_LABEL="Keep unsaved images (days)"
PLG_SYSTEM_GSSMARKDOWN_TMP_DAYS_DESC="Temporary images of articles that were never saved are deleted after this many days."
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_PREVIEW="Preview"
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_PREVIEW_DESC="Site-wide: the editor preview renders into the layout of a real published article page (its stylesheets and containers, without scripts, header, sidebars and footer). Authors cannot change how the preview looks."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_PAGE_LABEL="Article page to borrow the layout from"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_PAGE_DESC="Site-relative URL of a published article. Empty = the article being edited if it is published, otherwise the latest published public article of that component."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_SELECTOR_LABEL="Article body selector"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_SELECTOR_DESC="Element that holds the article text on that page. Empty = [data-blog-content] for EasyBlog, [itemprop=articleBody] for Joomla articles. Supports tag, #id, .class and [attr=value], comma separated."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_VIEWPORT_LABEL="Viewport width (px)"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_VIEWPORT_DESC="Browser width the layout is rendered at (desktop). The article column then has its front-end width; if the preview pane is narrower it is scaled down, which keeps line breaks identical."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CACHE_LABEL="Refresh layout every (hours)"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CACHE_DESC="The article page is fetched from the site at most this often (each fetch is a page view of that article). Authors can reload it on demand."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CSS_LABEL="Custom preview CSS"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CSS_DESC="Added after the site's stylesheets, for adjustments without code changes."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_STYLESHEETS_LABEL="Fallback stylesheets"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_STYLESHEETS_DESC="Only used when no article page can be loaded. One site-relative URL per line."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_WRAPPER_LABEL="Fallback wrapper class"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_WIDTH_LABEL="Fallback maximum width"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_WIDTH_DESC="Width of the article column on the site, e.g. 760px. Only used with the fallback stylesheets."
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_KB_LABEL="Maximum article size for preview (KB)"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_FETCH_BASE_LABEL="Internal site URL for fetching the layout"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_FETCH_BASE_DESC="Only if the server cannot reach the site's public address (Docker, reverse proxy): the address at which the server reaches this Joomla site, e.g. http://localhost/. Stylesheets still use the public address."
PLG_SYSTEM_GSSMARKDOWN_VIDEO_TITLE="Video"
