PLG_SYSTEM_GSSMARKDOWN="系統 - GSS Markdown"
PLG_SYSTEM_GSSMARKDOWN_XML_DESCRIPTION="GSS Markdown 編輯器的伺服器端：把送出的 Markdown 轉成經過淨化的 HTML、將新文章的圖片搬到文章目錄、並在前台為程式碼上色。使用編輯器期間必須保持啟用。"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_LABEL="Markdown 中的 HTML"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_DESC="跳脫：在 Markdown 裡打的 HTML 會以文字顯示（最安全）。僅允許清單標籤：只保留下方列出的標籤，屬性限於安全清單，事件處理器與 style 一律移除。"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_ESCAPE="跳脫（以文字顯示）"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_WHITELIST="僅允許清單中的標籤"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_TAGS_LABEL="允許的 HTML 標籤"
PLG_SYSTEM_GSSMARKDOWN_RAW_HTML_TAGS_DESC="以逗號分隔。script、iframe、object、embed、style 與表單元素永遠不允許。"
PLG_SYSTEM_GSSMARKDOWN_FRONTEND_HIGHLIGHT_LABEL="前台程式碼上色"
PLG_SYSTEM_GSSMARKDOWN_FRONTEND_HIGHLIGHT_DESC="在含有本編輯器程式碼區塊的頁面載入內附的 Prism，不載入任何外部檔案。"
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_IMAGES="圖片"
PLG_SYSTEM_GSSMARKDOWN_MAX_SIZE_LABEL="單張圖片上限（MB）"
PLG_SYSTEM_GSSMARKDOWN_MAX_DIR_LABEL="每篇文章上限（MB）"
PLG_SYSTEM_GSSMARKDOWN_MAX_DIR_DESC="單篇文章（或一份未存檔草稿）的圖片總大小上限。"
PLG_SYSTEM_GSSMARKDOWN_ALLOW_SVG_LABEL="允許 SVG"
PLG_SYSTEM_GSSMARKDOWN_ALLOW_SVG_DESC="SVG 可能夾帶程式碼。開啟時，每個 SVG 在儲存前都會強制淨化（移除 script、事件處理器與外部參照）。"
PLG_SYSTEM_GSSMARKDOWN_EASYBLOG_DIR_LABEL="EasyBlog 圖片目錄"
PLG_SYSTEM_GSSMARKDOWN_TMP_DIR_LABEL="暫存目錄"
PLG_SYSTEM_GSSMARKDOWN_TMP_DIR_DESC="文章第一次存檔前貼上的圖片會放在這裡。已用 .htaccess / web.config 禁止直接存取，編輯器透過需登入的網址顯示。"
PLG_SYSTEM_GSSMARKDOWN_GENERIC_DIR_LABEL="其他元件的圖片目錄"
PLG_SYSTEM_GSSMARKDOWN_GENERIC_DIR_DESC="用於 Joomla 文章（{目錄}/com_content/{id}）及沒有存檔事件的元件（模組、分類）。"
PLG_SYSTEM_GSSMARKDOWN_TMP_DAYS_LABEL="未存檔圖片保留天數"
PLG_SYSTEM_GSSMARKDOWN_TMP_DAYS_DESC="從未存檔之文章的暫存圖片，超過此天數後刪除。"
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_PREVIEW="預覽"
PLG_SYSTEM_GSSMARKDOWN_FIELDSET_PREVIEW_DESC="站台層級：編輯器預覽會渲染進一篇真實已發布文章頁的版型（沿用其樣式表與外層容器，不含 script、頁首、側欄、頁尾）。作者個人無法改變預覽的呈現。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_PAGE_LABEL="借用版型的文章頁"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_PAGE_DESC="已發布文章的站台相對網址。留空＝正在編輯的文章（若已發布），否則使用該元件最新一篇公開文章。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_SELECTOR_LABEL="文章內文選擇器"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_SELECTOR_DESC="該頁中放文章內文的元素。留空＝EasyBlog 用 [data-blog-content]、Joomla 文章用 [itemprop=articleBody]。支援 tag、#id、.class、[attr=value]，以逗號分隔多組。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_VIEWPORT_LABEL="視窗寬度（px）"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_VIEWPORT_DESC="以此桌機寬度渲染版型，使內文欄寬與前台相同；預覽欄較窄時整體等比縮小，折行位置不變。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CACHE_LABEL="版型更新間隔（小時）"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CACHE_DESC="最多每隔這段時間向站台抓一次文章頁（每次抓取會計入該文章一次瀏覽）。作者也可手動重新載入。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CSS_LABEL="預覽自訂 CSS"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_CSS_DESC="載入於前台樣式表之後，供微調使用，不需改程式碼。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_STYLESHEETS_LABEL="備用樣式表"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_STYLESHEETS_DESC="僅在無法載入文章頁時使用。每行一個站台相對網址。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_WRAPPER_LABEL="備用外層 class"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_WIDTH_LABEL="備用最大寬度"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_WIDTH_DESC="前台內文欄寬，例如 760px。僅搭配備用樣式表使用。"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_MAX_KB_LABEL="預覽文章大小上限（KB）"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_FETCH_BASE_LABEL="抓取版型用的內部網址"
PLG_SYSTEM_GSSMARKDOWN_PREVIEW_FETCH_BASE_DESC="僅在伺服器連不到站台對外網址時填寫（例如 Docker、反向代理）：伺服器本身連到此 Joomla 的網址，例如 http://localhost/。樣式表仍使用對外網址。"
PLG_SYSTEM_GSSMARKDOWN_VIDEO_TITLE="影片"
